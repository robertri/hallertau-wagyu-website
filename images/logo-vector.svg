<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440">

  <!--
    Coordinate grid
    ───────────────
    Canvas:        1000 × 440
    Center X:       500
    Horn base Y:    195   (where horns attach to cone)
    Cone center X:  500
    Cone top Y:     108
    Cone tip Y:     302
    Cone half-width at waist: 78  → x 422..578
    和 center:      500, y baseline ~375
  -->

  <!-- ═══════════════════════════════════════════
       HORNS  —  filled shape between two curves
       Left: from x=422 y=202 → sweeps left,
             dips slightly → tip-taper at x=28 y=195
       Right: mirror
  ═══════════════════════════════════════════ -->

  <!-- Left horn filled shape -->
  <path fill="#606060" fill-rule="evenodd"
        d="
          M 422,202
          C 380,204 300,210 210,218
          C 138,224  72,218  28,195
          C  18,190  14,184  18,178
          C  20,172  28,170  38,174
          C  72,188 138,192 210,188
          C 300,181 380,174 420,172
          C 418,178 418,190 422,202
          Z"/>

  <!-- Right horn filled shape (mirror) -->
  <path fill="#606060" fill-rule="evenodd"
        d="
          M 578,202
          C 620,204 700,210 790,218
          C 862,224 928,218 972,195
          C 982,190 986,184 982,178
          C 980,172 972,170 962,174
          C 928,188 862,192 790,188
          C 700,181 620,174 580,172
          C 582,178 582,190 578,202
          Z"/>

  <!-- ═══════════════════════════════════════════
       HOP CONE  —  filled bract layers
       Built bottom-up, each layer a leaf/petal shape

       Row 1 (bottom, 3 petals):  y 248..302
       Row 2 (mid-low, 4 petals): y 210..262
       Row 3 (mid-high, 3 petals): y 170..228
       Row 4 (top, 2 petals):     y 136..192
       Crown (3 spikes):          y 108..155
  ═══════════════════════════════════════════ -->

  <!-- STEM -->
  <line x1="500" y1="108" x2="500" y2="82"
        stroke="#606060" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Teardrop dot at stem top -->
  <ellipse cx="500" cy="77" rx="5" ry="7" fill="#606060"/>

  <!-- ── Row 1 bottom  (3 petals: left, center, right) ── -->
  <!-- Center bottom petal -->
  <path fill="#606060"
        d="M 500,302
           C 484,285 476,268 480,255
           C 486,244 500,242 500,242
           C 500,242 514,244 520,255
           C 524,268 516,285 500,302 Z"/>

  <!-- Left bottom petal -->
  <path fill="#606060"
        d="M 458,290
           C 442,274 436,256 442,244
           C 448,234 462,232 468,238
           C 476,246 478,262 476,276
           C 474,284 468,290 458,290 Z"/>

  <!-- Right bottom petal -->
  <path fill="#606060"
        d="M 542,290
           C 558,274 564,256 558,244
           C 552,234 538,232 532,238
           C 524,246 522,262 524,276
           C 526,284 532,290 542,290 Z"/>


  <!-- ── Row 2 mid-low  (4 petals) ── -->
  <!-- Center-left -->
  <path fill="#606060"
        d="M 484,262
           C 468,246 462,228 468,216
           C 474,206 488,204 494,210
           C 500,218 500,234 498,250
           C 496,258 490,264 484,262 Z"/>

  <!-- Center-right -->
  <path fill="#606060"
        d="M 516,262
           C 532,246 538,228 532,216
           C 526,206 512,204 506,210
           C 500,218 500,234 502,250
           C 504,258 510,264 516,262 Z"/>

  <!-- Left mid -->
  <path fill="#606060"
        d="M 448,258
           C 432,240 428,220 436,208
           C 442,198 456,196 464,204
           C 472,212 474,228 470,244
           C 468,254 458,262 448,258 Z"/>

  <!-- Right mid -->
  <path fill="#606060"
        d="M 552,258
           C 568,240 572,220 564,208
           C 558,198 544,196 536,204
           C 528,212 526,228 530,244
           C 532,254 542,262 552,258 Z"/>


  <!-- ── Row 3 mid-high  (3 petals) ── -->
  <!-- Center -->
  <path fill="#606060"
        d="M 500,228
           C 486,212 482,194 488,182
           C 494,172 500,170 500,170
           C 500,170 506,172 512,182
           C 518,194 514,212 500,228 Z"/>

  <!-- Left -->
  <path fill="#606060"
        d="M 462,222
           C 446,206 442,186 450,174
           C 456,164 470,162 478,170
           C 486,180 486,198 482,214
           C 480,222 470,226 462,222 Z"/>

  <!-- Right -->
  <path fill="#606060"
        d="M 538,222
           C 554,206 558,186 550,174
           C 544,164 530,162 522,170
           C 514,180 514,198 518,214
           C 520,222 530,226 538,222 Z"/>


  <!-- ── Row 4 upper  (2 petals) ── -->
  <!-- Left upper -->
  <path fill="#606060"
        d="M 476,188
           C 462,172 460,152 468,140
           C 474,132 486,130 492,138
           C 498,148 498,166 494,182
           C 492,190 482,194 476,188 Z"/>

  <!-- Right upper -->
  <path fill="#606060"
        d="M 524,188
           C 538,172 540,152 532,140
           C 526,132 514,130 508,138
           C 502,148 502,166 506,182
           C 508,190 518,194 524,188 Z"/>


  <!-- ── Crown spikes (3 pointed tips at top) ── -->
  <!-- Left crown spike -->
  <path fill="#606060"
        d="M 472,152
           C 464,138 462,122 468,112
           C 472,106 480,104 484,110
           C 490,120 490,138 486,152
           C 482,160 474,158 472,152 Z"/>

  <!-- Center crown spike -->
  <path fill="#606060"
        d="M 500,142
           C 494,126 494,110 500,102
           C 504,96  510,96  514,102
           C 520,112 518,128 512,142
           C 508,150 502,150 500,142 Z"/>

  <!-- Right crown spike -->
  <path fill="#606060"
        d="M 528,152
           C 536,138 538,122 532,112
           C 528,106 520,104 516,110
           C 510,120 510,138 514,152
           C 518,160 526,158 528,152 Z"/>


  <!-- ── Outer cone silhouette: thin stroke overlay to define edge ── -->
  <path fill="none" stroke="#606060" stroke-width="2.4" stroke-linecap="round"
        opacity="0.5"
        d="M 500,108
           C 472,112 438,132 424,164
           C 414,188 416,218 426,244
           C 438,272 462,292 500,302
           C 538,292 562,272 574,244
           C 584,218 586,188 576,164
           C 562,132 528,112 500,108 Z"/>


  <!-- ═══════════════════════════════════════════
       和  —  filled, centered below cone
  ═══════════════════════════════════════════ -->
  <text x="500" y="385"
        text-anchor="middle"
        font-family="'Hiragino Mincho ProN','Yu Mincho','MS Mincho','Noto Serif JP',Georgia,serif"
        font-size="88"
        fill="#606060">和</text>

</svg>
